# Build libimgui-java64.so for Android arm64 (bionic) using the Android NDK.
name: Build imgui Android arm64
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get imgui-java 1.90.0
        run: git clone --depth 1 --branch v1.90.0 --recurse-submodules https://github.com/SpaiR/imgui-java.git src

      - name: Generate JNI sources (host build also runs, that is fine)
        working-directory: src
        run: ./gradlew imgui-binding:generateLibs -Denvs=linux -Dfreetype=false

      - name: Compile with Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK=$NDK"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" --version
          cd /tmp/imgui/jni
          ls -d jni-headers
          mkdir -p /tmp/obj
          ls *.cpp | xargs -P 4 -I{} "$CXX" -c -O2 -fPIC -std=c++17 -Wno-everything \
            -Ijni-headers -Ijni-headers/linux -I. {} -o /tmp/obj/{}.o
          "$CXX" -shared -static-libstdc++ -Wl,-z,max-page-size=16384 \
            -o /tmp/libimgui-java64.so /tmp/obj/*.o
          file /tmp/libimgui-java64.so
          readelf -d /tmp/libimgui-java64.so | grep NEEDED
          cp /tmp/libimgui-java64.so "$GITHUB_WORKSPACE/libimgui-java64.so"

      - uses: actions/upload-artifact@v4
        with:
          name: libimgui-java64-android-arm64
          path: libimgui-java64.so
